<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1500" viewBox="0 0 1200 1500" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3b4a6b"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f8a5f"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b5750a"/>
    </marker>
  </defs>

  <rect width="1200" height="1500" fill="#f7f8fb"/>

  <!-- Title -->
  <text x="600" y="48" text-anchor="middle" font-size="26" font-weight="700" fill="#1c2333">MGS5 EV Dashboard — Architecture &amp; Data Flow</text>
  <text x="600" y="74" text-anchor="middle" font-size="14" fill="#6b7280">Single-user · Local Mac · localhost only · Manual + optional scheduled refresh</text>

  <!-- Boundary: Mac / localhost -->
  <rect x="60" y="110" width="1080" height="640" rx="14" fill="#ffffff" stroke="#c7cedd" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="86" y="140" font-size="14" font-weight="700" fill="#3b4a6b">Your Mac — localhost only, nothing exposed externally</text>

  <!-- Browser box -->
  <rect x="100" y="165" width="330" height="220" rx="10" fill="#eef1fb" stroke="#8b9ac9" stroke-width="1.5"/>
  <text x="265" y="192" text-anchor="middle" font-size="15" font-weight="700" fill="#1c2333">Browser — React/Vite SPA</text>
  <text x="265" y="212" text-anchor="middle" font-size="11" fill="#4b5468">localhost:8001 (default, configurable)</text>

  <rect x="118" y="226" width="294" height="34" rx="6" fill="#ffffff" stroke="#c7cedd"/>
  <text x="265" y="248" text-anchor="middle" font-size="12" fill="#1c2333">Dashboard: SOC, range, 12V, tyres, SOH trend</text>

  <rect x="118" y="266" width="294" height="34" rx="6" fill="#ffffff" stroke="#c7cedd"/>
  <text x="265" y="288" text-anchor="middle" font-size="12" fill="#1c2333">Manual "Refresh" button</text>

  <rect x="118" y="306" width="294" height="34" rx="6" fill="#ffffff" stroke="#c7cedd"/>
  <text x="265" y="328" text-anchor="middle" font-size="12" fill="#1c2333">Settings: schedule toggle + interval</text>

  <rect x="118" y="346" width="294" height="26" rx="6" fill="#fff7ea" stroke="#e0b568"/>
  <text x="265" y="363" text-anchor="middle" font-size="10.5" fill="#7a5410">setInterval timer — only while tab is open</text>

  <!-- Backend box -->
  <rect x="480" y="165" width="330" height="220" rx="10" fill="#eafbf2" stroke="#5bbf90" stroke-width="1.5"/>
  <text x="645" y="188" text-anchor="middle" font-size="15" font-weight="700" fill="#1c2333">FastAPI Backend</text>
  <text x="645" y="206" text-anchor="middle" font-size="11" fill="#4b5468">localhost:8000</text>

  <rect x="498" y="218" width="294" height="26" rx="6" fill="#ffffff" stroke="#bfe3cf"/>
  <text x="645" y="235" text-anchor="middle" font-size="11" fill="#1c2333">POST /api/refresh — rate-limit gate (30 min floor)</text>

  <rect x="498" y="250" width="294" height="26" rx="6" fill="#ffffff" stroke="#bfe3cf"/>
  <text x="645" y="267" text-anchor="middle" font-size="11" fill="#1c2333">GET /api/latest (+ /advanced, /battery-usage)</text>

  <rect x="498" y="282" width="294" height="26" rx="6" fill="#ffffff" stroke="#bfe3cf"/>
  <text x="645" y="299" text-anchor="middle" font-size="11" fill="#1c2333">GET /api/history · GET/PUT /api/settings</text>

  <rect x="498" y="314" width="294" height="26" rx="6" fill="#ffffff" stroke="#bfe3cf"/>
  <text x="645" y="331" text-anchor="middle" font-size="11" fill="#1c2333">GET /api/soh — reads persisted estimates</text>

  <rect x="498" y="346" width="294" height="30" rx="6" fill="#ffffff" stroke="#bfe3cf"/>
  <text x="645" y="362" text-anchor="middle" font-size="10.5" fill="#1c2333">Refresh side effect: SOH cycle detection (persisted).</text>
  <text x="645" y="374" text-anchor="middle" font-size="10.5" fill="#1c2333">Battery-usage fallback: computed per GET, not stored.</text>

  <!-- SQLite box -->
  <rect x="860" y="165" width="240" height="220" rx="10" fill="#fdeee8" stroke="#e0a48c" stroke-width="1.5"/>
  <text x="980" y="192" text-anchor="middle" font-size="15" font-weight="700" fill="#1c2333">SQLite</text>
  <text x="980" y="212" text-anchor="middle" font-size="11" fill="#4b5468">single local .db file</text>

  <rect x="878" y="226" width="204" height="40" rx="6" fill="#ffffff" stroke="#e6c3b4"/>
  <text x="980" y="243" text-anchor="middle" font-size="11.5" fill="#1c2333">car_snapshot</text>
  <text x="980" y="258" text-anchor="middle" font-size="9.5" fill="#6b7280">SOC, range, 12V, raw_json...</text>

  <rect x="878" y="274" width="204" height="30" rx="6" fill="#ffffff" stroke="#e6c3b4"/>
  <text x="980" y="294" text-anchor="middle" font-size="11.5" fill="#1c2333">app_settings</text>

  <rect x="878" y="312" width="204" height="30" rx="6" fill="#ffffff" stroke="#e6c3b4"/>
  <text x="980" y="332" text-anchor="middle" font-size="11.5" fill="#1c2333">soh_estimate (derived)</text>

  <!-- saic client library -->
  <rect x="480" y="420" width="330" height="90" rx="10" fill="#f1eefb" stroke="#a48bc9" stroke-width="1.5"/>
  <text x="645" y="448" text-anchor="middle" font-size="14" font-weight="700" fill="#1c2333">saic-python-client-ng</text>
  <text x="645" y="468" text-anchor="middle" font-size="11" fill="#4b5468">Handles SAIC auth, session refresh,</text>
  <text x="645" y="484" text-anchor="middle" font-size="11" fill="#4b5468">raw telemetry retrieval (Python library)</text>

  <!-- .env -->
  <rect x="860" y="420" width="240" height="90" rx="10" fill="#fff7ea" stroke="#e0b568" stroke-width="1.5"/>
  <text x="980" y="448" text-anchor="middle" font-size="14" font-weight="700" fill="#1c2333">.env (local file)</text>
  <text x="980" y="470" text-anchor="middle" font-size="11" fill="#4b5468">Secondary iSmart credentials</text>
  <text x="980" y="486" text-anchor="middle" font-size="11" fill="#4b5468">gitignored, never logged</text>

  <!-- Arrows inside boundary -->
  <line x1="430" y1="275" x2="478" y2="275" stroke="#3b4a6b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="454" y="265" text-anchor="middle" font-size="10" fill="#3b4a6b">REST</text>

  <line x1="478" y1="300" x2="430" y2="300" stroke="#3b4a6b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="454" y="315" text-anchor="middle" font-size="10" fill="#3b4a6b">JSON response</text>

  <line x1="810" y1="245" x2="858" y2="245" stroke="#b5750a" stroke-width="2" marker-end="url(#arrowAmber)"/>
  <text x="834" y="235" text-anchor="middle" font-size="10" fill="#b5750a">write snapshot</text>

  <line x1="858" y1="290" x2="810" y2="290" stroke="#b5750a" stroke-width="2" marker-end="url(#arrowAmber)"/>
  <text x="834" y="305" text-anchor="middle" font-size="10" fill="#b5750a">read history</text>

  <line x1="645" y1="385" x2="645" y2="418" stroke="#1f8a5f" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <line x1="700" y1="418" x2="700" y2="385" stroke="#1f8a5f" stroke-width="2" marker-end="url(#arrowGreen)"/>

  <line x1="810" y1="460" x2="858" y2="460" stroke="#b5750a" stroke-width="2" marker-end="url(#arrowAmber)"/>
  <text x="834" y="450" text-anchor="middle" font-size="9.5" fill="#b5750a">read creds</text>

  <!-- External boundary: SAIC cloud -->
  <rect x="60" y="800" width="1080" height="230" rx="14" fill="#fff5f5" stroke="#e39a9a" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="86" y="830" font-size="14" font-weight="700" fill="#a13d3d">External — SAIC / MG iSmart cloud (unofficial, reverse-engineered)</text>

  <rect x="440" y="855" width="320" height="130" rx="10" fill="#fde3e3" stroke="#d97f7f" stroke-width="1.5"/>
  <text x="600" y="885" text-anchor="middle" font-size="15" font-weight="700" fill="#1c2333">SAIC iSmart Cloud API</text>
  <text x="600" y="908" text-anchor="middle" font-size="11" fill="#5a3030">Same backend the official</text>
  <text x="600" y="924" text-anchor="middle" font-size="11" fill="#5a3030">MG iSmart mobile app uses</text>
  <text x="600" y="948" text-anchor="middle" font-size="10.5" fill="#8a4a4a" font-style="italic">Requires dedicated secondary account —</text>
  <text x="600" y="964" text-anchor="middle" font-size="10.5" fill="#8a4a4a" font-style="italic">a 2nd client logs the primary app out</text>

  <!-- Arrow from client lib down to cloud -->
  <line x1="645" y1="510" x2="600" y2="853" stroke="#a13d3d" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="500" y="680" font-size="12" fill="#a13d3d" font-weight="600">HTTPS request</text>
  <text x="500" y="698" font-size="11" fill="#a13d3d">(only on refresh, min 30 min gap)</text>

  <line x1="655" y1="853" x2="700" y2="510" stroke="#a13d3d" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <text x="760" y="700" font-size="12" fill="#a13d3d" font-weight="600">Telemetry response</text>
  <text x="760" y="718" font-size="11" fill="#a13d3d">SOC, range (BMS+IMCU), 12V, tyres...</text>

  <!-- Vehicle icon box -->
  <rect x="60" y="855" width="330" height="130" rx="10" fill="#ffffff" stroke="#e39a9a" stroke-width="1.5"/>
  <text x="225" y="885" text-anchor="middle" font-size="14" font-weight="700" fill="#1c2333">MG MGS5 EV</text>
  <text x="225" y="905" text-anchor="middle" font-size="11" fill="#4b5468">Luxury · 64 kWh gross / 62.1 kWh usable</text>
  <text x="225" y="925" text-anchor="middle" font-size="10.5" fill="#6b7280">Reports telemetry to SAIC cloud</text>
  <text x="225" y="941" text-anchor="middle" font-size="10.5" fill="#6b7280">via built-in TCU (not directly reachable)</text>
  <text x="225" y="962" text-anchor="middle" font-size="10" fill="#a13d3d" font-style="italic">No SOH field exposed here —</text>
  <text x="225" y="977" text-anchor="middle" font-size="10" fill="#a13d3d" font-style="italic">SOH is derived by our backend instead</text>

  <line x1="390" y1="910" x2="438" y2="910" stroke="#a13d3d" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Legend -->
  <text x="86" y="1060" font-size="14" font-weight="700" fill="#1c2333">Legend</text>

  <line x1="86" y1="1082" x2="126" y2="1082" stroke="#3b4a6b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="136" y="1087" font-size="12" fill="#3b4a6b">Frontend ↔ Backend (REST, local)</text>

  <line x1="86" y1="1108" x2="126" y2="1108" stroke="#b5750a" stroke-width="2" marker-end="url(#arrowAmber)"/>
  <text x="136" y="1113" font-size="12" fill="#b5750a">Backend ↔ SQLite / .env (local disk I/O)</text>

  <line x1="86" y1="1134" x2="126" y2="1134" stroke="#1f8a5f" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="136" y="1139" font-size="12" fill="#1f8a5f">Backend ↔ saic-python-client-ng (in-process call)</text>

  <line x1="86" y1="1160" x2="126" y2="1160" stroke="#a13d3d" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="136" y="1165" font-size="12" fill="#a13d3d">External network call (only on refresh, rate-limited)</text>

  <!-- Data flow sequence box -->
  <rect x="60" y="1200" width="1080" height="270" rx="14" fill="#ffffff" stroke="#c7cedd" stroke-width="1.5"/>
  <text x="86" y="1230" font-size="14" font-weight="700" fill="#1c2333">Refresh Data Flow — Step by Step</text>

  <g font-size="11.5" fill="#1c2333">
    <text x="100" y="1258">1</text><text x="130" y="1258">User clicks "Refresh" (or scheduled timer fires while tab is open)</text>
    <text x="100" y="1282">2</text><text x="130" y="1282">Frontend calls POST /api/refresh</text>
    <text x="100" y="1306">3</text><text x="130" y="1306">Backend checks last_fetched_at against the 30-minute minimum gap</text>
    <text x="100" y="1330">4a</text><text x="130" y="1330">If too soon → backend returns the cached latest snapshot from SQLite, no external call made</text>
    <text x="100" y="1354">4b</text><text x="130" y="1354">If gap has elapsed → backend calls saic-python-client-ng, which authenticates (using .env credentials)</text>
    <text x="100" y="1378">5</text><text x="130" y="1378">saic-python-client-ng sends an HTTPS request to the SAIC cloud API and receives telemetry</text>
    <text x="100" y="1402">6</text><text x="130" y="1402">Backend parses the response, writes a new row to car_snapshot (incl. raw_json), updates SOH job if a full-charge cycle completed</text>
    <text x="100" y="1426">7</text><text x="130" y="1426">Backend returns the fresh snapshot as JSON to the frontend</text>
    <text x="100" y="1450">8</text><text x="130" y="1450">Frontend updates the dashboard cards and trend charts, shows "Last updated" timestamp</text>
  </g>
</svg>
